# Panic-location strings embed absolute build paths into the binary; remap
# them to neutral prefixes so the exe leaks neither machine paths nor crate
# names. rustc applies the LAST matching prefix, so rules go generic ->
# specific; target sections repeat them because they replace build.rustflags.
[build]
rustflags = [
    "--remap-path-prefix=/root/.cargo/registry/src=/o",
    "--remap-path-prefix=/usr/local/rustup/toolchains=/t",
    "--remap-path-prefix=/app/fury=/p",
    "--remap-path-prefix=src/hd=/a",
    "--remap-path-prefix=src/ev=/b",
    "--remap-path-prefix=src/pt=/c",
    "--remap-path-prefix=src/md/mod.rs=/e0",
    "--remap-path-prefix=src/md/pscan.rs=/e1",
    "--remap-path-prefix=src/md/execass.rs=/e2",
    "--remap-path-prefix=src/md/service.rs=/e3",
    "--remap-path-prefix=src/main.rs=/m1",
    "--remap-path-prefix=src/cf.rs=/m2",
    "--remap-path-prefix=src/ky.rs=/m3",
    "--remap-path-prefix=src/ob.rs=/m4",
    "--remap-path-prefix=src/pr.rs=/m5",
    "--remap-path-prefix=src/sc.rs=/m6",
    "--remap-path-prefix=src/sy.rs=/m7",
    "--remap-path-prefix=src/tl.rs=/m8",
    "--remap-path-prefix=src/dl.rs=/m9",
    "--remap-path-prefix=vendor/r=/d1",
    "--remap-path-prefix=vendor/c=/d2",
    "--remap-path-prefix=vendor/s=/d3",
    "--remap-path-prefix=vendor/u=/d4",
    "--remap-path-prefix=/app/fury/vendor=/pv",

    "--remap-path-prefix=/rustc/ed61e7d7e242494fb7057f2657300d9e77bb4fcb=/l",
    "--remap-path-prefix=src/hd=/a",
    "--remap-path-prefix=src/ev=/b",
    "--remap-path-prefix=src/pt=/c",
    "--remap-path-prefix=src/md/mod.rs=/e0",
    "--remap-path-prefix=src/md/pscan.rs=/e1",
    "--remap-path-prefix=src/md/execass.rs=/e2",
    "--remap-path-prefix=src/md/service.rs=/e3",
    "--remap-path-prefix=src/main.rs=/m1",
    "--remap-path-prefix=src/cf.rs=/m2",
    "--remap-path-prefix=src/ky.rs=/m3",
    "--remap-path-prefix=src/ob.rs=/m4",
    "--remap-path-prefix=src/pr.rs=/m5",
    "--remap-path-prefix=src/sc.rs=/m6",
    "--remap-path-prefix=src/sy.rs=/m7",
    "--remap-path-prefix=src/tl.rs=/m8",
    "--remap-path-prefix=src/dl.rs=/m9",
    "--remap-path-prefix=vendor/r=/d1",
    "--remap-path-prefix=vendor/c=/d2",
    "--remap-path-prefix=vendor/s=/d3",
    "--remap-path-prefix=vendor/u=/d4",
    "--remap-path-prefix=/app/fury/vendor=/pv",
]

