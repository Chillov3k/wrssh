<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSSH Admin Edit User</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-pending">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-block">
        <h1>WRSSH</h1>
        
      </div>

      <nav class="nav-list">
        <a class="nav-item" href="projects">Projects</a>
        <a class="nav-item active hidden" data-admin-only href="users">Manage Users</a>
      </nav>

      <div class="user-card">
        <p class="user-card-title">Signed in as <strong id="currentUserName">-</strong></p>
        <div class="user-card-actions">
          <button id="editProfileButton" class="ghost-button" type="button">Edit</button>
          <button id="logoutButton" class="ghost-button" type="button">Logout</button>
        </div>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <p class="eyebrow">Identity</p>
          <h2 id="viewTitle">Edit User</h2>
          <p id="topbarMeta" class="topbar-meta muted">Waiting for initial sync</p>
        </div>
        <a id="backToUsersLink" class="ghost-button action-link" href="users">Back To Users</a>
      </header>

      <section class="page-body">
        <div id="userEditNoAccess" class="panel hidden">
          <div class="empty-state compact-empty">
            <p>Only the administrator can edit managed users.</p>
          </div>
        </div>

        <div id="userEditPanel" class="panel create-project-panel user-edit-panel hidden">
          <div class="panel-header">
            <div>
              <p class="eyebrow">User</p>
              <h3 id="editUserHeading">Edit Managed User</h3>
            </div>
          </div>

          <div id="userEditEmpty" class="empty-state compact-empty hidden">
            <p>No user was selected.</p>
          </div>

          <form id="editUserForm" class="field-stack hidden">
            <div class="editor-grid user-editor-grid">
              <label class="field-stack">
                <span>Username</span>
                <input id="editUsernameInput" type="text" readonly>
              </label>
              <label class="field-stack">
                <span>RSSH Username</span>
                <input id="editRSSHUsernameInput" type="text" readonly>
              </label>
            </div>
            <label class="check-row">
              <input id="editCanCreateProjects" type="checkbox">
              Allow creating new projects
            </label>
            <div class="field-stack">
              <span>Allowed Projects</span>
              <div id="editProjectsPicker" class="project-picker-shell"></div>
            </div>
            <label class="field-stack">
              <span>SSH Public Keys</span>
              <textarea id="editAuthorizedKeysInput" rows="10" placeholder="ssh-ed25519 AAAA... user@host"></textarea>
            </label>
            <div class="inline-actions">
              <button id="saveUserButton" class="action-button" type="submit">Save User</button>
              <button id="resetPasswordButton" class="ghost-button" type="button">Reset Password</button>
              <button id="deleteUserButton" class="danger-button" type="button">Delete User</button>
            </div>
          </form>

          <div id="editUserOutput" class="field-note output-note hidden"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="loginOverlay" class="overlay">
    <div class="overlay-card">
      <p class="eyebrow">Authenticate</p>
      <h2>Sign In To RSSH Admin</h2>
      <form id="loginForm" class="login-form">
        <label class="field-stack">
          <span>Username</span>
          <input id="loginUsername" type="text" autocomplete="username" required>
        </label>
        <label class="field-stack">
          <span>Password</span>
          <input id="loginPassword" type="password" autocomplete="current-password" required>
        </label>
        <button class="action-button" type="submit">Login</button>
      </form>
      <p id="loginError" class="error-text"></p>
    </div>
  </div>

  <script type="module" src="user-edit.js"></script>
</body>
</html>
