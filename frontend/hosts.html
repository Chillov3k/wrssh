<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSSH Admin Hosts</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-pending">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-block">
        <h1>WRSSH</h1>
        
      </div>

      <div id="projectContext" class="project-context hidden">
        <p class="eyebrow">Project</p>
        <strong id="sidebarProjectName">-</strong>
        <div id="sidebarProjectTags" class="tag-list"></div>
        <a id="changeProjectLink" class="ghost-button action-link" href="projects">Change Project</a>
      </div>

      <nav class="nav-list">
        <a class="nav-item" href="overview">Overview</a>
        <a class="nav-item active" href="hosts">Hosts</a>
        <a class="nav-item" href="builds">Builds</a>
        <a class="nav-item" href="downloads">Downloads</a>
        <a class="nav-item hidden" data-admin-only href="users">Manage Users</a>
      </nav>

      <div class="user-card">
        <p class="user-card-title">Signed in as <strong id="currentUserName">-</strong></p>
        <div class="user-card-actions">
          <button id="editProfileButton" class="ghost-button" type="button">Edit</button>
          <button id="logoutButton" class="ghost-button" type="button">Logout</button>
        </div>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <p class="eyebrow">Inventory</p>
          <h2 id="viewTitle">Hosts</h2>
          <p id="topbarMeta" class="topbar-meta muted">Waiting for initial sync</p>
        </div>
        <button id="refreshButton" class="action-button">Refresh</button>
      </header>

      <section class="page-body">
        <div class="panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Clients</p>
              <h3>Managed Hosts</h3>
            </div>
            <div class="hosts-toolbar-controls">
              <div id="osFilter" class="segmented-filter" aria-label="Filter hosts by operating system">
                <button class="segmented-filter-button is-active" type="button" data-os-filter="all">All</button>
                <button class="segmented-filter-button" type="button" data-os-filter="linux">Linux</button>
                <button class="segmented-filter-button" type="button" data-os-filter="windows">Windows</button>
                <button class="segmented-filter-button" type="button" data-os-filter="darwin">macOS</button>
              </div>
              <input id="hostSearch" class="search-input search-input-wide" type="search" placeholder="Filter by connection id, hostname, tag or IP">
            </div>
          </div>
          <div class="bulk-exec-panel">
            <div class="bulk-exec-form">
              <label class="field-stack bulk-command-field">
                <span>Run Command On Selected Hosts</span>
                <input id="bulkCommandInput" class="search-input" type="text" placeholder="ip a">
              </label>
              <div class="bulk-exec-actions">
                <span id="bulkSelectionSummary" class="chip">0 selected</span>
                <button id="selectVisibleHostsButton" class="ghost-button" type="button">Select Visible</button>
                <button id="clearSelectedHostsButton" class="ghost-button" type="button">Clear</button>
                <button id="runSelectedHostsButton" class="action-button" type="button">Run On Selected</button>
              </div>
            </div>
            <p id="bulkExecOutput" class="error-text bulk-exec-output"></p>
          </div>
          <div id="hostTable" class="table-shell"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="loginOverlay" class="overlay">
    <div class="overlay-card">
      <p class="eyebrow">Authenticate</p>
      <h2>Sign In To RSSH Admin</h2>
      <form id="loginForm" class="login-form">
        <label class="field-stack">
          <span>Username</span>
          <input id="loginUsername" type="text" autocomplete="username" required>
        </label>
        <label class="field-stack">
          <span>Password</span>
          <input id="loginPassword" type="password" autocomplete="current-password" required>
        </label>
        <button class="action-button" type="submit">Login</button>
      </form>
      <p id="loginError" class="error-text"></p>
    </div>
  </div>

  <script type="module" src="hosts.js"></script>
</body>
</html>
