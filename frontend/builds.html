<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSSH Admin Builds</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-pending">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-block">
        <h1>WRSSH</h1>
        
      </div>

      <div id="projectContext" class="project-context hidden">
        <p class="eyebrow">Project</p>
        <strong id="sidebarProjectName">-</strong>
        <div id="sidebarProjectTags" class="tag-list"></div>
        <a id="changeProjectLink" class="ghost-button action-link" href="projects">Change Project</a>
      </div>

      <nav class="nav-list">
        <a class="nav-item" href="overview">Overview</a>
        <a class="nav-item" href="hosts">Hosts</a>
        <a class="nav-item active" href="builds">Builds</a>
        <a class="nav-item" href="downloads">Downloads</a>
        <a class="nav-item hidden" data-admin-only href="users">Manage Users</a>
      </nav>

      <div class="user-card">
        <p class="user-card-title">Signed in as <strong id="currentUserName">-</strong></p>
        <div class="user-card-actions">
          <button id="editProfileButton" class="ghost-button" type="button">Edit</button>
          <button id="logoutButton" class="ghost-button" type="button">Logout</button>
        </div>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <h2 id="viewTitle">Builds</h2>
          <p id="topbarMeta" class="topbar-meta muted">Waiting for initial sync</p>
        </div>
        <button id="refreshButton" class="action-button">Refresh</button>
      </header>

      <section class="page-body">
        <div id="artifactBuilderPanel" class="panel">
          <div class="panel-header">
            <div>
              <h3>CREATE CLIENT ARTIFACT</h3>
            </div>
          </div>
          <form id="artifactForm" class="artifact-form">
            <label class="field-stack">
              <span>Name</span>
              <input name="name" type="text" placeholder="Name of agent">
            </label>
            <label class="field-stack">
              <span>Comment</span>
              <input name="comment" type="text" placeholder="Displayed alias/comment">
            </label>
            <label class="field-stack">
              <span>Connect-Back Address</span>
              <select id="connectBackHost" name="connectBackHost"></select>
            </label>
            <label id="connectBackCustomField" class="field-stack hidden">
              <span>Custom Connect-Back Host/IP</span>
              <input id="connectBackCustomHost" type="text" placeholder="192.168.1.138">
            </label>
            <label class="field-stack">
              <span>Port</span>
              <input id="connectBackPort" name="connectBackPort" type="text" placeholder="listener port from config">
            </label>
            <label class="field-stack">
              <span>GOOS</span>
              <select id="goosSelect" name="goos"></select>
            </label>
            <label class="field-stack">
              <span>GOARCH</span>
              <select id="goarchSelect" name="goarch"></select>
            </label>
            <label class="field-stack">
              <span>Transport</span>
              <select name="transport">
                <option value="ssh">ssh</option>
                <option value="tls">tls</option>
                <option value="ws">ws</option>
                <option value="wss">wss</option>
                <option value="http">http</option>
                <option value="https">https</option>
              </select>
            </label>
            <label class="field-stack field-wide">
              <span>Working Directory</span>
              <input name="workingDirectory" type="text" placeholder="/tmp">
            </label>
            <details class="advanced-block field-wide">
              <summary>Advanced Build Options</summary>
              <div class="advanced-grid">
                <label class="check-row build-check-row"><input name="sharedObject" type="checkbox"><span class="build-check-label">Shared object <span class="help-badge" data-build-help="shared-object" aria-hidden="true">?</span></span></label>
                <label class="check-row build-check-row"><input name="garble" type="checkbox"><span class="build-check-label">Garble <span class="help-badge" data-build-help="garble" aria-hidden="true">?</span></span></label>
                <label class="check-row build-check-row"><input name="upx" type="checkbox"><span class="build-check-label">UPX compression <span class="help-badge" data-build-help="upx" aria-hidden="true">?</span></span></label>
                <label class="check-row build-check-row"><input name="lzma" type="checkbox"><span class="build-check-label">LZMA with UPX <span class="help-badge" data-build-help="lzma" aria-hidden="true">?</span></span></label>
                <label class="check-row build-check-row"><input name="rawDownload" type="checkbox"><span class="build-check-label">Raw download command <span class="help-badge" data-build-help="raw-download" aria-hidden="true">?</span></span></label>
                <label class="check-row build-check-row"><input name="useHostHeader" type="checkbox"><span class="build-check-label">Use Host header <span class="help-badge" data-build-help="use-host-header" aria-hidden="true">?</span></span></label>
                <label class="check-row build-check-row"><input name="noHistorySave" type="checkbox"><span class="build-check-label">Stealth mode <span class="help-badge" data-build-help="no-history-save" aria-hidden="true">?</span></span></label>
                <label class="check-row build-check-row"><input name="busyBoxFallback" type="checkbox"><span class="build-check-label">BusyBox fallback <span class="help-badge" data-build-help="busybox-fallback" aria-hidden="true">?</span></span></label>
                <label class="check-row build-check-row"><input name="pscan" type="checkbox"><span class="build-check-label">Port scanner (pscan) <span class="help-badge" data-build-help="pscan" aria-hidden="true">?</span></span></label>
                <label class="check-row build-check-row"><input name="execass" type="checkbox"><span class="build-check-label">Execute assembly <span class="help-badge" data-build-help="execass" aria-hidden="true">?</span></span></label>
              </div>
            </details>
            <button class="action-button" type="submit">Create Artifact</button>
          </form>
          <pre id="artifactCreateOutput" class="output-block small-output"></pre>
        </div>
      </section>
    </main>
  </div>

  <div id="loginOverlay" class="overlay">
    <div class="overlay-card">
      <p class="eyebrow">Authenticate</p>
      <h2>Sign In To RSSH Admin</h2>
      <form id="loginForm" class="login-form">
        <label class="field-stack">
          <span>Username</span>
          <input id="loginUsername" type="text" autocomplete="username" required>
        </label>
        <label class="field-stack">
          <span>Password</span>
          <input id="loginPassword" type="password" autocomplete="current-password" required>
        </label>
        <button class="action-button" type="submit">Login</button>
      </form>
      <p id="loginError" class="error-text"></p>
    </div>
  </div>

  <script type="module" src="builds.js"></script>
</body>
</html>
