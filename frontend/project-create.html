<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSSH Admin Create Project</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-pending">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-block">
        <h1>WRSSH</h1>
        
      </div>

      <nav class="nav-list">
        <a class="nav-item active" href="projects">Projects</a>
        <a class="nav-item hidden" data-admin-only href="users">Manage Users</a>
      </nav>

      <div class="user-card">
        <p class="user-card-title">Signed in as <strong id="currentUserName">-</strong></p>
        <div class="user-card-actions">
          <button id="editProfileButton" class="ghost-button" type="button">Edit</button>
          <button id="logoutButton" class="ghost-button" type="button">Logout</button>
        </div>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <p class="eyebrow">Projects</p>
          <h2 id="viewTitle">Create Project</h2>
          <p id="topbarMeta" class="topbar-meta muted">Waiting for initial sync</p>
        </div>
        <a class="ghost-button action-link" href="projects">Back To Projects</a>
      </header>

      <section class="page-body">
        <div class="panel create-project-panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Project</p>
              <h3>Create New Project</h3>
            </div>
          </div>
          <form id="projectForm" class="field-stack">
            <label class="field-stack">
              <span>Name</span>
              <input id="projectNameInput" name="name" type="text" maxlength="128" placeholder="ctf-lab" required>
            </label>
            <label class="field-stack">
              <span>Description</span>
              <textarea id="projectDescriptionInput" name="description" rows="5" placeholder="What this project contains and how it is used."></textarea>
            </label>
            <label class="field-stack">
              <span>Project Tags</span>
              <input id="projectTagsInput" name="tags" type="text" placeholder="ctf,windows,lab">
            </label>
            <button id="projectSubmitButton" class="action-button" type="submit">Create Project</button>
          </form>
          <pre id="projectFormOutput" class="output-block small-output"></pre>
        </div>
      </section>
    </main>
  </div>

  <div id="loginOverlay" class="overlay">
    <div class="overlay-card">
      <p class="eyebrow">Authenticate</p>
      <h2>Sign In To RSSH Admin</h2>
      <form id="loginForm" class="login-form">
        <label class="field-stack">
          <span>Username</span>
          <input id="loginUsername" type="text" autocomplete="username" required>
        </label>
        <label class="field-stack">
          <span>Password</span>
          <input id="loginPassword" type="password" autocomplete="current-password" required>
        </label>
        <button class="action-button" type="submit">Login</button>
      </form>
      <p id="loginError" class="error-text"></p>
    </div>
  </div>

  <script type="module" src="project-create.js"></script>
</body>
</html>
